{% extends "base.html" %}

{% block title %}Sign In — Cognimap AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3.5rem auto;">
  <div class="card card-glow" style="padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1.25rem auto; width: 50px; height: 50px;">
        <i data-lucide="network" style="width: 26px; height: 26px;"></i>
      </div>
      <h2 style="font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.35rem;">Sign in to your Cognimap AI portal</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div style="position: relative;">
          <input type="email" name="email" id="login-email" class="form-control" placeholder="name@cognimap.edu" required autocomplete="email" style="padding-left: 2.5rem;">
          <i data-lucide="mail" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-dim);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-left: 2.5rem;">
          <i data-lucide="lock" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-dim);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem; font-weight: 700;">
        <span>Sign In to Account</span>
        <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
      </button>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); text-align: center;">
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.85rem;">
        Quick Role Demo Access
      </div>
      <div style="display: flex; gap: 0.65rem;">
        <a href="{{ url_for('demo_login', role='student') }}" class="btn btn-secondary btn-sm" style="flex: 1; gap: 0.4rem;">
          <i data-lucide="graduation-cap" style="width: 15px; height: 15px; color: var(--brand-cyan);"></i>
          <span>Student Demo</span>
        </a>
        <a href="{{ url_for('demo_login', role='lecturer') }}" class="btn btn-secondary btn-sm" style="flex: 1; gap: 0.4rem;">
          <i data-lucide="presentation" style="width: 15px; height: 15px; color: var(--brand-purple);"></i>
          <span>Lecturer Demo</span>
        </a>
      </div>
    </div>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--brand-primary-light); text-decoration: none; font-weight: 600;">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
